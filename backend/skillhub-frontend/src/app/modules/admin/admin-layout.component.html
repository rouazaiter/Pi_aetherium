<div class="admin-shell" [class.collapsed]="!sidebarOpen">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo" *ngIf="sidebarOpen">⚙️ Admin</span>
      <button class="toggle-btn" (click)="sidebarOpen = !sidebarOpen">
        <i class="fa" [class.fa-bars]="!sidebarOpen" [class.fa-times]="sidebarOpen"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
         class="nav-item">
        <i class="fa" [class]="'fa ' + item.icon"></i>
        <span *ngIf="sidebarOpen">{{ item.label }}</span>
      </a>
    </nav>
    <div class="sidebar-footer" *ngIf="sidebarOpen">
      <a routerLink="/" class="back-link"><i class="fa fa-arrow-left"></i> Back to Site</a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>

</div>

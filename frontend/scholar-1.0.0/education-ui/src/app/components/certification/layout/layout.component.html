<div class="cert-shell" [class.cert-shell--no-sidebar]="!isAdmin">

  <!-- ── Sidebar (admin only) ─────────────────────────────────────────────── -->
  <aside class="cert-sidebar" *ngIf="isAdmin">

    <!-- Brand — fused with nav -->
    <div class="cert-sidebar__brand">
      <div class="cert-sidebar__brand-mark">🎓</div>
      <div>
        <div class="cert-sidebar__title">SkillHub</div>
        <div class="cert-sidebar__subtitle">{{ isAdmin ? 'Admin Panel' : 'Certifications' }}</div>
      </div>
    </div>

    <nav class="cert-sidebar__nav">

      <!-- ── Admin backoffice ──────────────────────────────────────────── -->
      <ng-container *ngIf="isAdmin">
        <span class="cert-sidebar__section">Backoffice</span>

        <a routerLink="/skillhub/dashboard"
           routerLinkActive="cert-sidebar__link--active"
           [routerLinkActiveOptions]="{exact: true}"
           class="cert-sidebar__link">
          <svg viewBox="0 0 24 24" class="cert-sidebar__link-icon" aria-hidden="true">
            <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor"/>
          </svg>
          Dashboard
        </a>

        <a routerLink="/skillhub/certifications"
           routerLinkActive="cert-sidebar__link--active"
           [routerLinkActiveOptions]="{exact: true}"
           class="cert-sidebar__link">
          <svg viewBox="0 0 24 24" class="cert-sidebar__link-icon" aria-hidden="true">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" fill="currentColor"/>
          </svg>
          Certifications
        </a>

        <a routerLink="/skillhub/certifications/analytics"
           routerLinkActive="cert-sidebar__link--active"
           class="cert-sidebar__link">
          <svg viewBox="0 0 24 24" class="cert-sidebar__link-icon" aria-hidden="true">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z" fill="currentColor"/>
          </svg>
          Analytics
        </a>
      </ng-container>

      <!-- ── User frontoffice ──────────────────────────────────────────── -->
      <ng-container *ngIf="!isAdmin">
        <span class="cert-sidebar__section">Browse</span>

        <a routerLink="/skillhub/store"
           routerLinkActive="cert-sidebar__link--active"
           [routerLinkActiveOptions]="{exact: true}"
           class="cert-sidebar__link">
          <svg viewBox="0 0 24 24" class="cert-sidebar__link-icon" aria-hidden="true">
            <path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM5.2 5H3V3H1v2h2l3.6 7.6L5.2 15c-.1.3-.2.6-.2.9C5 17.1 5.9 18 7 18h14v-2H7.4c-.1 0-.2-.1-.2-.2l.1-.3.9-1.5H19c.8 0 1.4-.4 1.8-1l3.6-6.5c.4-.7-.1-1.5-.9-1.5H5.2z" fill="currentColor"/>
          </svg>
          Store
        </a>

        <a routerLink="/skillhub/store/my"
           routerLinkActive="cert-sidebar__link--active"
           class="cert-sidebar__link">
          <svg viewBox="0 0 24 24" class="cert-sidebar__link-icon" aria-hidden="true">
            <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 15h8v2H8zm0-4h8v2H8z" fill="currentColor"/>
          </svg>
          My Certifications
        </a>

        <a routerLink="/skillhub/verify"
           routerLinkActive="cert-sidebar__link--active"
           class="cert-sidebar__link">
          <svg viewBox="0 0 24 24" class="cert-sidebar__link-icon" aria-hidden="true">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/>
          </svg>
          Verify Certificate
        </a>
      </ng-container>

    </nav>
  </aside>

  <!-- ── Main content ──────────────────────────────────────────────────────── -->
  <main class="cert-main">
    <router-outlet></router-outlet>
  </main>

</div>

<app-toast></app-toast>

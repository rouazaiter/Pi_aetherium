<section class="chat-panel-shell h-full min-h-0 bg-white">
  <div #chatMessages class="chat-messages p-4 space-y-4 bg-white">
    <div *ngIf="messages.length === 0" class="chat-empty">
      <div class="chat-empty__icon">💬</div>
      <div class="chat-empty__title">Start the conversation</div>
      <div class="chat-empty__subtitle">Messages will appear here in real time.</div>
    </div>

    <div
      *ngFor="let msg of messages; trackBy: trackMessage"
      class="flex flex-col gap-1 message-row"
      [class.items-end]="msg.senderId === userId"
      [class.message-row--system]="msg.senderId === 0"
      [class.message-row--recent]="msg.id === recentMessageId">
      <div class="flex items-center justify-between w-full">
        <span class="text-[12px] font-semibold" [ngClass]="msg.senderId === userId ? 'text-primary' : 'text-slate-900'">{{ msg.senderId === userId ? 'You' : msg.senderName }}</span>
        <span class="text-[10px] text-slate-400">{{ formatTime(msg.timestamp) }}</span>
      </div>
      <div
        class="chat-bubble p-2 rounded-xl text-[13px] max-w-[85%]"
        [ngClass]="msg.senderId === 0
          ? 'bg-slate-50 text-slate-500 text-xs border border-slate-200 italic'
          : (msg.senderId === userId ? 'chat-bubble--own bg-indigo-600 text-white rounded-tr-sm shadow-sm' : 'chat-bubble--other bg-slate-100 text-slate-800 rounded-tl-sm')">
        {{ msg.content }}
      </div>
    </div>
  </div>

  <div class="p-2.5 border-t border-slate-100 bg-white chat-composer-wrap">
    <p *ngIf="chatError" class="chat-error">{{ chatError }}</p>
    <div class="relative chat-composer">
      <textarea
        [(ngModel)]="newMessage"
        (input)="onMessageInput()"
        (keydown)="onMessageKeydown($event)"
        placeholder="Type a message..."
        rows="1"
        class="w-full border border-slate-200 bg-white rounded-xl p-2 pr-11 text-[13px] focus:outline-none focus:ring-2 focus:ring-indigo-200 focus:border-indigo-300 resize-none overflow-hidden text-slate-900"></textarea>
      <button type="button" (click)="sendMessage()" [disabled]="isSending" class="chat-send-btn absolute right-2 top-1/2 -translate-y-1/2 text-primary hover:text-primary-container disabled:text-slate-300">
        <span class="material-symbols-outlined">send</span>
      </button>
    </div>
  </div>
</section>

<main class="w-full h-full min-h-0 flex flex-col min-w-0 bg-white dark:bg-slate-900 relative" layout-main>
  <app-code-workspace-panel class="flex-1 min-h-0 block" *ngIf="activeTab === 'code'" [roomId]="roomId"></app-code-workspace-panel>
  <app-whiteboard-panel class="flex-1 min-h-0 block" *ngIf="activeTab === 'whiteboard'" [roomId]="roomId"></app-whiteboard-panel>
  <div
    *ngIf="workspaceAccessBlocked && !isHost"
    class="absolute inset-0 z-20 bg-transparent pointer-events-auto">
    <div class="absolute top-3 right-3 px-3 py-1.5 rounded-md bg-white/90 border border-slate-200 text-slate-700 text-xs font-semibold shadow-sm">
      Access blocked by host
    </div>
  </div>
</main>

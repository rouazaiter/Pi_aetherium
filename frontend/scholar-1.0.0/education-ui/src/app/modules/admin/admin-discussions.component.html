<div class="admin-page">
  <div class="admin-page-header">
    <h2>Discussions</h2>
    <input class="search-input" [(ngModel)]="search" placeholder="Search by theme or creator...">
  </div>

  <div class="spinner-wrap" *ngIf="loading"><div class="spinner"></div></div>

  <table class="admin-table" *ngIf="!loading">
    <thead>
      <tr>
        <th>ID</th>
        <th>Theme</th>
        <th>Creator</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of filtered">
        <td>{{ d.id }}</td>
        <td>{{ d.theme }}</td>
        <td>{{ d.creator?.username }}</td>
        <td><span class="badge" [class]="d.status?.toLowerCase()">{{ d.status }}</span></td>
        <td>
          <button class="btn-icon danger" (click)="deleteDiscussion(d)" title="Delete"><i class="fa fa-trash"></i></button>
        </td>
      </tr>
      <tr *ngIf="filtered.length === 0">
        <td colspan="5" class="empty-row">No discussions found.</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="admin-page">
  <div class="admin-page-header">
    <h2>Users</h2>
    <input class="search-input" [(ngModel)]="search" placeholder="Search by name or email...">
  </div>

  <div class="spinner-wrap" *ngIf="loading"><div class="spinner"></div></div>

  <table class="admin-table" *ngIf="!loading">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of filtered">
        <td>{{ u.id }}</td>
        <td><i class="fa fa-user-circle"></i> {{ u.username }}</td>
        <td>{{ u.email }}</td>
      </tr>
      <tr *ngIf="filtered.length === 0">
        <td colspan="3" class="empty-row">No users found.</td>
      </tr>
    </tbody>
  </table>
</div>

spring.application.name=education-platform-backend
# Load local secrets from .env.local (not committed to git)
spring.config.import=optional:file:./.env.local[.properties]

# ===============================
# SERVER
# ===============================
server.port=8089
spring.mvc.async.request-timeout=600000

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Ghassenpiskillhub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.uploads.profile-pictures-dir=uploads/profile-pictures
app.uploads.voice-messages-dir=uploads/voice-messages

# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000

# ===============================
# OAUTH
# ===============================
app.oauth.google-client-id=${GOOGLE_CLIENT_ID:679411521835-7q64ktvpt7anrfg1hmumjv5bsf2oe1nq.apps.googleusercontent.com}
app.oauth.facebook-app-id=${FACEBOOK_APP_ID:1947309899485311}
app.oauth.facebook-app-secret=${FACEBOOK_APP_SECRET:}

# ===============================
# FRONTEND
# ===============================
app.frontend-base-url=http://localhost:4202

# ===============================
# MAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:skillhub26.contact@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.from=${MAIL_USERNAME:skillhub26.contact@gmail.com}
spring.mail.properties.mail.debug=true
app.mail.from=${MAIL_USERNAME:skillhub26.contact@gmail.com}
app.reclamations.notify-email=${MAIL_USERNAME:skillhub26.contact@gmail.com}

# ===============================
# OPENROUTER (LLM)
# ===============================
openai.api.key=${OPENROUTER_API_KEY:}
openai.api.url=https://openrouter.ai/api/v1/chat/completions
openai.model=openai/gpt-4o-mini

# ===============================
# STRIPE
# ===============================
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# ===============================
# TWILIO
# ===============================
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}
